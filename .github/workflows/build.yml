name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app and helper (ad-hoc signed)
        shell: bash
        run: |
          set -euo pipefail
          for target in ClaudeMenuBar claude-notify; do
            xcodebuild -project ClaudeMenuBar.xcodeproj -target "$target" \
              -configuration Release SYMROOT="$PWD/build" build | tail -n 3
          done
      - name: Helper smoke test
        shell: bash
        run: |
          out=$(echo '{"session_id":"ci","hook_event_name":"PreToolUse"}' | build/Release/claude-notify running)
          test -z "$out" || { echo "helper printed to stdout: $out"; exit 1; }
      - name: Hook installer test
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME/.claude"
          echo '{"model":"sonnet","hooks":{"Stop":[{"matcher":"","hooks":[{"type":"command","command":"echo keep"}]}]}}' > "$HOME/.claude/settings.json"
          python3 scripts/hooks.py install /tmp/claude-notify
          python3 scripts/hooks.py install /tmp/claude-notify | grep -q "already up to date"
          python3 scripts/hooks.py uninstall
          python3 -c "import json,os;d=json.load(open(os.path.expanduser('~/.claude/settings.json')));assert d=={'model':'sonnet','hooks':{'Stop':[{'matcher':'','hooks':[{'type':'command','command':'echo keep'}]}]}},d"
