name: ClaudeMenuBar
options:
  bundleIdPrefix: io.github.aryanpappu
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"          # Swift 5 language mode (needs Xcode 16+)
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"

targets:

  ClaudeMenuBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: Sources/App/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: ClaudeMenuBar
        CFBundleDisplayName: Claude Menu Bar
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "15.0"
        CFBundleIconName: AppIcon
        NSHumanReadableCopyright: "MIT License. Not affiliated with Anthropic."
    settings:
      base:
        # Keep the original bundle id so existing installs keep their
        # Accessibility / notification permissions after updating.
        PRODUCT_BUNDLE_IDENTIFIER: com.claudemenubar.app
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  claude-notify:
    type: tool
    platform: macOS
    sources:
      - path: Sources/CLI
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claudemenubar.notify
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
